*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Inter Tight",system-ui,sans-serif}
header.top{position:fixed;top:0;left:0;right:0;height:52px;background:var(--side);color:var(--side-ink);display:flex;align-items:center;gap:14px;padding:0 14px;z-index:20}
.logo{font-weight:700;font-size:16px;white-space:nowrap}.logo i{color:#4cc27f;font-style:normal}

.st,.tool{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit}
.tool.fast{margin-top:6px;border:1px dashed #4cc27f;color:#4cc27f;font-weight:600}.btn.bulk{border-color:var(--accent);color:var(--accent)}

.st .num{width:24px;height:24px;border-radius:50%;border:1.5px solid #4cc27f;display:grid;place-items:center;font-size:12px;flex:none}
.st.done .num{background:#4cc27f;color:#0b0f0d}.st small{display:block;font-size:10.5px;opacity:.7}.st.locked{opacity:.45}.st .lock{margin-left:auto;font-size:11px}
main#main{margin:52px 0 0 228px;padding:18px 22px 60px;min-height:calc(100vh - 52px);transition:margin .2s}
body.chat-open main#main{margin-right:360px}
.phead .kicker,.kicker{color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.phead h2{margin:2px 0 12px;font-size:22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px;min-width:0}
.card.inner{background:var(--bg);margin-top:12px}.card h3{margin:0 0 10px;font-size:15.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card h4{margin:6px 0 6px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g-40-60{grid-template-columns:2fr 3fr}.g-45-55{grid-template-columns:9fr 11fr}.grid2>*,.grid3>*{min-width:0}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.sticky{position:sticky;top:64px;align-self:start}
.guide{background:var(--info-soft);border-left:4px solid var(--info);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:14px;font-size:13.5px}.guide b{color:var(--info);margin-right:6px}
.btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover:not([disabled]){border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.sm{padding:4px 9px;font-size:12.5px}.btn.xs{padding:2px 7px;font-size:12px}.btn.big{padding:12px 22px;font-size:16px}.btn.full{width:100%;margin-top:8px}
.navbar{display:flex;justify-content:space-between;margin-top:8px}
.gatebox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--accent)}
.gate{display:inline-block;padding:3px 9px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:12.5px}.gate.done{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;white-space:nowrap}
.t-ref{background:var(--accent-soft);color:var(--accent)}.t-asm{background:var(--warn-soft);color:var(--warn)}.t-mock{background:var(--info-soft);color:var(--info)}.t-calc,.t-oth{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

.bar{display:inline-block;width:70px;height:7px;border-radius:4px;background:var(--line);vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.bar.warnb i{background:var(--warn)}
.tw{overflow:auto}.tw.tall{max-height:440px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}.tbl th{position:sticky;top:0;background:var(--paper);font-size:12px;color:var(--muted)}
.tbl tr.grp td{background:var(--accent-soft);font-weight:700;color:var(--accent)}.tbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tbl tr.low{background:var(--warn-soft)}.tbl tr.conf td:first-child{box-shadow:inset 3px 0 var(--accent)}.tbl tr.flag{background:var(--bad-soft)}.tbl tr.ovr{background:var(--info-soft)}.tbl tr.sel{outline:2px solid var(--accent)}
.tbl tr[data-act]{cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input.num{width:84px}input.num.s{width:56px}input.reason{width:100%;margin-top:4px;border-color:var(--warn)}input.reason.wide{min-width:420px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}.fld input,.fld select{color:var(--ink);font-size:14px}.fld.inline{flex-direction:row;align-items:center;gap:8px;margin:4px 0}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:var(--muted)}.b{font-weight:700}.req{color:var(--bad)}.sug{color:var(--info)}.nowrap{white-space:nowrap}.center{display:flex;justify-content:center}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;margin-bottom:10px}
.note{padding:8px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-size:13px;margin:8px 0}.note.ok{background:var(--accent-soft);border-color:transparent}.note.bad{background:var(--bad-soft);border-color:transparent}
.checks{list-style:none;padding:0;margin:0}.checks li{margin:4px 0}
.chk{white-space:nowrap;cursor:pointer}
.svgv,.svgp,.svgu,.svgr{width:100%;height:auto;display:block}.svgb{width:48%;height:auto;display:inline-block}
.svt{font:11px "Inter Tight",sans-serif;fill:var(--ink)}.svt.sm{font-size:9.5px}.svt.b{font-weight:700}.svt.muted{fill:var(--muted)}.svt.lab{fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2px}
.zp{cursor:pointer}.zp:hover{filter:brightness(1.12)}.zp.zsel{filter:saturate(1.5) brightness(1.15) drop-shadow(0 0 1.5px var(--ink))}.zp.hl{filter:brightness(1.1) saturate(1.2)}

.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;border:1px solid var(--edge)}
.splitbar{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ze input:not(.num){width:140px}
ol.rank{margin:0;padding-left:20px}ol.rank li{margin:5px 0}
.pick{cursor:pointer}.pick.sel{outline:2px solid var(--accent);background:var(--accent-soft)}.pick h4{margin:0 0 4px}
.recwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}.opt.sel{border:2px solid var(--accent)}

.opt .parts{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:4px 0}.why-list{margin:4px 0;padding-left:16px;font-size:12px;color:var(--muted)}.warnl{font-size:12px;color:var(--warn);margin:2px 0 6px}
.ringbox{text-align:center}
.why{background:none;border:1px solid var(--info);color:var(--info);border-radius:10px;font-size:10.5px;padding:0 6px;cursor:pointer;font-weight:600}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.kpis>div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:140px}.kpis b{display:block;font-size:19px}.kpis span{font-size:12px;color:var(--muted)}.kpis.col{flex-direction:column}
.sheetwrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.sheet{width:100%;min-width:760px;height:auto;display:block}
textarea.rat{width:100%;min-height:200px;font-size:13px}
.outcome{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:16px;margin-bottom:14px}.outcome h2{margin:0 0 6px;color:var(--accent)}.outcome .dl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.outcome .sheet{min-width:0}
.job{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer;background:var(--bg)}.job.sel{outline:2px solid var(--accent)}.job .mt{text-align:right;min-width:150px}.job .mt span{display:block}
.hit{border-left:3px solid var(--accent);padding:4px 10px;margin:8px 0;background:var(--bg);border-radius:0 6px 6px 0}.hit p{margin:4px 0}
.row{display:flex;gap:8px}.row input{flex:1}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.hero{max-width:980px}.hero h1{font-size:34px;margin:6px 0}.hero .lead{font-size:16px}
.flowline{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.fl{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}.fl b{color:var(--accent);margin-right:5px}.fl small{margin-left:5px;color:var(--warn);font-weight:700}
.legendline{margin:12px 0 18px;font-size:13px}
#chatwrap{position:fixed;top:52px;right:0;bottom:0;width:360px;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s;z-index:15}
body.chat-open #chatwrap{transform:none}
#chatwrap .ch{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}

.msg .cite{color:var(--info);font-size:11.5px;font-weight:600}.msg .src{font-size:12px;color:var(--muted);margin-top:6px}
.sugs{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px}.sugs button{font-size:11.5px}
.cin{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.cin input{flex:1}

.mbox{background:var(--bg);border-radius:12px;max-width:980px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}.mh{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.mb{padding:14px 16px}.badt{color:var(--bad)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px}.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px}.toast.ok{background:var(--accent);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@media (max-width:1100px){.grid-side,.recwrap,.views,.g-40-60,.g-45-55{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:800px){aside.side{position:static;width:auto;top:0}main#main{margin:52px 0 0 0;padding:14px 16px}.grid2,.grid3,.form2{grid-template-columns:1fr}#projmeta{display:none}body.chat-open main#main{margin-right:0}#chatwrap{width:100%}input.reason.wide{min-width:0;width:100%}}
@media print{header.top,aside.side,#chatwrap,.navbar,.guide,.gatebox,.tabs{display:none!important}main#main{margin:0}}
</style>
</head>

  <button class="tb" data-act="toggleChat">💬 Assistant</button>

  <button class="tool" data-act="view" data-v="audit">🕘 Audit log</button>
  <p class="small" style="padding:10px 8px;color:#9aa9a0">Demo level D1 · data tags: REF / ASSUMED / MOCK. Not TRL-approved values.</p>
</aside>
<main id="main"><div id="view"></div></main>
<section id="chatwrap" aria-label="Assistant">

  <div id="chat"></div>
  <div class="sugs">

    <button class="btn xs" data-act="ask" data-q="Widen charge pad to 110">Widen charge pad to 110°</button>
    <button class="btn xs" data-act="ask" data-q="Show similar jobs">Similar jobs</button>
    <button class="btn xs" data-act="ask" data-q="specific volume limit">Specific volume limit</button>
  </div>
  <div class="cin"><input id="q" placeholder="Ask, or give an instruction…"><button class="btn primary sm" onclick="askAssistant()">Send</button></div>
</section>
<div id="modal"></div><div id="toasts"></div>

function shellOnlySVG(hl) {
  // Dynamically build segments from S.geom so manual alterations instantly update the diagram!
  const G_val = k => { const g = S.geom.find(x => x.key === k); return g ? +(g.value || 0) : 0; };
  
  const hD = G_val('hDish');
  const hL = G_val('hLC');
  const hB = G_val('hBar');
  const hT = G_val('hTop');
  const hM = G_val('hMouth');
  
  const rBottom = G_val('dBottom') / 2 || 2500;
  const rBarrel = G_val('dBarrel') / 2 || 3000;
  const rMouth = G_val('dMouth') / 2 || 2000;
  
  const segs = [
      { segment_type: 'dome', height_mm: hD, radius_bottom_mm: 0, radius_top_mm: rBottom },
      { segment_type: 'cone', height_mm: hL, radius_bottom_mm: rBottom, radius_top_mm: rBarrel },
      { segment_type: 'cylinder', height_mm: hB, radius_bottom_mm: rBarrel, radius_top_mm: rBarrel },
      { segment_type: 'cone', height_mm: hT, radius_bottom_mm: rBarrel, radius_top_mm: rMouth },
      { segment_type: 'neck', height_mm: hM, radius_bottom_mm: rMouth, radius_top_mm: rMouth }
  ];
  
  const W = 360, Hh = 420, pad = 30;
  const H = segs.reduce((acc, s) => acc + s.height_mm, 0);
  if (H === 0) return '';
  
  const s = (Hh - 2 * pad) / H, cx = W / 2;
  const X = (r, sd) => cx + sd * r * s, Y = h => Hh - pad - h * s;
  const parts = [];
  let currentH = 0;
  
  segs.forEach((seg, i) => {
      if (seg.height_mm <= 0) return; // skip 0-height segments
      const hStart = currentH;
      const hEnd = currentH + seg.height_mm;
      const rB = seg.radius_bottom_mm;
      const rT = seg.radius_top_mm;
      
      let L = [], R = [];
      if (seg.segment_type === 'dome') {
         // Bottom dish (widest at top) - spherical cap
         const rSphere = seg.height_mm > 0 ? (rT * rT + seg.height_mm * seg.height_mm) / (2 * seg.height_mm) : 1000;
         for (let h = hStart; h <= hEnd; h += Math.max(1, seg.height_mm/10)) {
             const hh = h - hStart;
             const r = Math.sqrt(Math.max(0, 2 * rSphere * hh - hh * hh));
             L.push(`${X(r, -1)},${Y(h)}`);
             R.unshift(`${X(r, 1)},${Y(h)}`);
         }
      } else {
         // cylinder or cone
         L.push(`${X(rB, -1)},${Y(hStart)}`);
         L.push(`${X(rT, -1)},${Y(hEnd)}`);
         R.unshift(`${X(rB, 1)},${Y(hStart)}`);
         R.unshift(`${X(rT, 1)},${Y(hEnd)}`);
      }
      
      // Use highlight if provided
      const highlight = (hl === ['dish','lc','bar','top','mouth'][i]);
      const fill = highlight ? 'rgba(31,138,76,.15)' : 'rgba(31,138,76,.06)';
      const stroke = highlight ? '#2c8a4c' : 'var(--ink)';
      
      parts.push(`<path d="M${L.join(' L')} L${R.join(' L')}Z" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`);
      
      // Dims line
      const maxR = Math.max(rB, rT);
      parts.push(`<line x1="${X(maxR + 200, -1)}" y1="${Y(hEnd)}" x2="${X(maxR + 200, 1)}" y2="${Y(hEnd)}" stroke="#1f5fae" stroke-width=".7" stroke-dasharray="4 3"/>`);
      parts.push(`<text x="${X(maxR + 250, 1)}" y="${(Y(hStart) + Y(hEnd)) / 2 + 4}" class="svt sm" fill="#1f5fae">${seg.height_mm.toFixed(1)}</text>`);
      
      currentH = hEnd;
  });
  
  // Add taphole nozzle line (on the Top Cone)
  const tapAngle = G_val('tapAngle') || 10;
  const tapZ = hD + hL + hB + hT * 0.38;
  const rTap = rBarrel - (rBarrel - rMouth) * 0.38;
  parts.push(`<line x1="${X(rTap + 250, 1)}" y1="${Y(tapZ + 120)}" x2="${X(Math.max(0, rTap - 300), 1)}" y2="${Y(tapZ + 40)}" stroke="#7a3cd0" stroke-width="3"/>`);
  parts.push(`<text x="${X(rTap + 260, 1)}" y="${Y(tapZ + 120)}" class="svt sm" fill="#7a3cd0">Taphole ${tapAngle}°</text>`);
  
  parts.push(`<text x="${cx}" y="${Hh - 8}" text-anchor="middle" class="svt sm muted">Overall ${H.toFixed(0)} mm (Editable)</text>`);
  return `<svg viewBox="0 0 ${W} ${Hh}" class="svgv" style="max-width: 400px; max-height: 500px;" role="img" aria-label="Shell drawing">${parts.join('')}</svg>`;
}

      <p style="color:#666; margin-top:5px">The AI is analyzing the drawing and extracting the shell profile.</p>

  ${S.enquiry.drawing && S.job_id && !S.isExtracting ? `<div class="card"><h3>Extracted Geometry <span class="small">AI Generated</span></h3>
    <div class="center" style="height:550px">
      <svg width="100%" height="100%" viewBox="0 0 360 420" preserveAspectRatio="xMidYMid meet">
        ${shellOnlySVG()}
      </svg>
    </div>
  </div>` : ''}

  <div class="card gatebox"><div>${bulkBtn(0)}${gateChip('G0')}</div>
   <button class="btn primary" data-act="gate" data-g="G0" ${S.enquiry.drawing && !S.gates.G0 ? '' : 'disabled'}>👤 Confirm enquiry details (G0)</button></div>
  ${footerNav(0, stepDone(0))}`;
}

/* ================= STEP 3 ================= */
function gradeSuggestions(z) {
  const n = z.name.toLowerCase(); const mech = /charge/.test(n) ? 'impact' : /trunnion|tap/.test(n) ? 'slag' : /rest/.test(n) ? 'general' : /bottom|lower/.test(n) ? 'general' : 'general';
  const tpl = TEMPLATE_ZONES.find(t => t.seg === z.seg && t.name === z.name);
  const jobs = LIBRARY.filter(j => j.verified).map(j => ({ j, zz: j.zones.find(t => t.seg === z.seg && t.name === z.name) })).filter(x => x.zz);
  const cands = (z.seg === 'mouth' ? ['Steel-clad (SCB)'] : WORK_GRADES).map(gname => {
    let s = 0; const why = [];
    if (BV('custGrade') !== 'None') { s += 0; }
    if (tpl && tpl.grade === gname) { s += 40; why.push('TRL template'); }
    const used = jobs.filter(x => x.zz.grade === gname); if (used.length) { s += 15 * used.length * (used.every(x => x.j.outcome.perf !== 'poor') ? 1 : 0.7); why.push(`${used.length} similar job(s)`); }
    const rk = (GRADES[gname].rank || {})[mech] || 0; s += rk * 6; why.push(`${mech} rating ${rk}/5`);
    return { g: gname, s, why: why.join(' · ') };
  }).sort((a, b) => b.s - a.s);
  return cands.slice(0, 3);
}
function lengthsFor(seg) { const fam = { lc: 'TSC', bar: 'BAR', top: 'TPZ', mouth: 'SCB', dish: null }[seg]; return fam ? [...new Set(PAIRS.filter(p => p.fam === fam).map(p => p.L))].sort((a, b) => a - b) : [800, 850, 900, 950, 1000]; }

  if (!S.zones.length) return `${guide('Choose a starting point for the lining concept: TRL\'s template or a similar past job from the design library (ranked by similarity).')}${startCards}${footerNav(3, false)}`;

const ACT = {
  go: d => go(d.n),
  view: d => { VIEW = d.v; render(); },
  role: d => { S.role = d.r; log('Role switched', d.r); render(); },
  loadDrawing: () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.pdf,.dxf,.dwg,.png,.jpg,.jpeg,.tiff';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      S.enquiry.drawing = file.name;
      S.isExtracting = true;
      render();

      const formData = new FormData();
      formData.append('file', file);
      
      try {
        const res = await fetch('http://localhost:8000/api/v1/extraction/process', { method: 'POST', body: formData });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        const geom = data.vessel_geometry;
        S.vesselGeometry = geom;
        S.job_id = data.job_id;
        if (geom && geom.shell && geom.shell.profile && geom.shell.profile.segments) {
            const segs = geom.shell.profile.segments;
            
            // Map extracted values to S.geom based on segment types
            const updateGeom = (key, value, conf = 0.9) => {
                const g = S.geom.find(x => x.key === key);
                if (g && value !== null && value !== undefined) {
                    g.value = value;
                    g.orig = value;
                    g.conf = conf;
                    g.src = 'AI Extracted';
                    g.tag = 'EXTRACTED';
                    g.confirmed = false;
                }
            };

            // Map intelligently based on Y-order (bottom to top) rather than hallucinated segment_types!
            const sortedSegs = segs.slice().sort((a, b) => (a.index || 0) - (b.index || 0));
            
            if (sortedSegs.length >= 5) {
                updateGeom('hDish', sortedSegs[0].height_mm);
                updateGeom('hLC', sortedSegs[1].height_mm);
                updateGeom('hBar', sortedSegs[2].height_mm);

    items.push(`${S.zones.length || TEMPLATE_ZONES.length} zones, grades and thicknesses approved`); items.push('Gate G3'); }

function dlCSV(w) {
  const b = bom(); let rows;
  if (w === 'bom') rows = [['Zone / item', 'Quality', 'Mark', 'Qty', 'Allowance %', 'Order qty', 'Unit vol dm3', 'Unit wt kg', 'Tonnes'], ...b.lines.map(l => [l.zone, l.grade, l.mark, l.qty, l.allow, l.qtyAllow, l.vol.toFixed(2), l.unitKg.toFixed(1), l.t.toFixed(3)]), [], ['Non-brick item', 'Qty', 'Unit'], ...b.nonbrick.map(n => [n.item, n.qty, n.unit])];
  else rows = [['Course', 'Segment', 'Zone', 'Grade', 'h0 mm', 'R hot mm', 'L mm', 'Mark A', 'nA', 'Mark B', 'nB', 'Cut mm'], ...b.layer.map(r => [r.course, r.seg, r.zone, r.grade, Math.round(r.h0), Math.round(r.R), r.L, r.A, r.nA, r.B, r.nB, r.nCut ? r.nCut + ' x ' + r.cut.toFixed(0) : ''])];
  download(w === 'bom' ? 'BOM_summary.csv' : 'BOM_layerwise.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
}
function dlDXF() {
  const g = geo(), e = [], tp = +BV('tPerm');
  const line = (x1, y1, x2, y2, layer) => e.push({ t: 'L', x1: x1.toFixed(1), y1: y1.toFixed(1), x2: x2.toFixed(1), y2: y2.toFixed(1), layer });
  for (const sd of [-1, 1]) {
    let prev = null; for (let h = 0; h <= g.H; h += 50) { const p = [sd * rShell(h, g), h]; if (prev) line(prev[0], prev[1], p[0], p[1], 'SHELL'); prev = p; }
    let ph = null; for (let h = g.z1; h <= g.H; h += 50) { const seg = segAt(h + 1, g); const z = zoneAt(seg, h + 1, sd < 0 ? 0 : 180); if (!z) continue; const cosb = seg === 'lc' ? Math.cos(g.bLC) : seg === 'top' ? Math.cos(g.bT) : 1; const p = [sd * (rShell(h, g) - g.p - (tp + z.t) / cosb), h]; if (ph) line(ph[0], ph[1], p[0], p[1], 'HOTFACE_' + z.grade.replace(/[^A-Z0-9]/gi, '_')); ph = p; }
  }
  courses().forEach(c => { for (const sd of [-1, 1]) { const ro = rShell(c.h0, g) - g.p; line(sd * ro, c.h0, sd * (ro - 1000), c.h0, 'COURSES'); } });
  const ck = checks(); line(-ck.rAtMl, ck.ml, ck.rAtMl, ck.ml, 'METAL_LEVEL');
  e.push({ t: 'T', x: -ck.rAtMl, y: ck.ml + 60, s: `180T METAL LEVEL ${Math.round(ck.ml)}`, layer: 'TEXT' });
  e.push({ t: 'T', x: -3000, y: -400, s: `REFRACTORY LINING FOR 180 MT BOF - ${S.rev || 'DRAFT'} - INSIDE VOL ${ck.V.toFixed(2)} M3`, layer: 'TEXT', h: 120 });
  S.zones.forEach((z, i) => e.push({ t: 'T', x: 4300, y: 9500 - i * 180, s: `${segName(z.seg)} ${z.name}: ${z.grade} ${z.t}mm`, layer: 'TEXT' }));
  download('BOF_lining_GA_sheet1.dxf', dxf(e), 'application/dxf');
}
/* ---------- assistant (mock RAG) ---------- */
const CHAT = [{ who: 'bot', html: 'Hello – I answer from the knowledge base (mock RAG) and the design traces, and I can prepare edits for you to confirm. Try a suggestion below.' }];
function askAssistant() {
  const q = $('#q').value.trim(); if (!q) return; $('#q').value = ''; CHAT.push({ who: 'me', html: esc(q) });
  const m = q.match(/(widen|set|change|make)\s+(the\s+)?charge pad\s+(to\s+)?(\d{2,3})/i);
  const t = q.match(/(set|change)\s+(the\s+)?(barrel|trunnion|charge pad|top cone|lower cone)\s+thickness\s+(to\s+)?(\d{3,4})/i);
  if (m) { const w = +m[4]; const cmd = { type: 'cpad', w }; CHAT.push({ who: 'bot', html: `Proposed change: charge pad ${w}° (centred on 0°), trunnion & tap pad ${360 - w}°. This re-opens the concept and brickwork. ${retrieveCite('charge pad width scrap ratio')}<br><button class="btn sm" data-act="applyCmd" data-cmd='${JSON.stringify(cmd)}'>Preview and apply</button>` }); }
  else if (t) { const cmd = { type: 'thick', zone: t[3].toLowerCase(), t: +t[5] }; CHAT.push({ who: 'bot', html: `Proposed change: ${t[3]} working thickness ${t[5]} mm. I will check it against TRL brick lengths. <button class="btn sm" data-act="applyCmd" data-cmd='${JSON.stringify(cmd)}'>Apply</button>` }); }
  else if (/similar/i.test(q)) { const r = LIBRARY.filter(j => j.verified).map(j => ({ j, s: similarity(j) })).sort((a, b) => b.s.total - a.s.total); CHAT.push({ who: 'bot', html: 'Most similar verified jobs: ' + r.slice(0, 3).map(x => `<b>${x.j.id}</b> ${(x.s.total * 100).toFixed(0)}% (${x.j.outcome.perf})`).join(', ') + '. <a href="#" data-act="view" data-v="library">Open design library</a>' }); }
  else if (/why|explain/i.test(q) && /c5r|charge/i.test(q)) { CHAT.push({ who: 'bot', html: answer('charge pad C5R scrap impact grade width') }); }
  else CHAT.push({ who: 'bot', html: answer(q) });
  render(); document.body.classList.add('chat-open');
}
function retrieveCite(q) { const h = retrieve(q, 1)[0]; return h ? `<span class="cite">[${h.doc.id} ${esc(h.h)}]</span>` : ''; }
function answer(q) {
  const hits = retrieve(q, 3); if (!hits.length) return 'I could not find this in the knowledge base. Try other words, or ask about zoning, grades, bricks, checks or past jobs.';
  const top = hits[0]; return `${esc(top.t)} <span class="cite">[${top.doc.id} ${esc(top.h)}]</span>${hits.slice(1).map(h => `<div class="src"><b>${h.doc.id} ${esc(h.h)}:</b> ${esc(h.t)}</div>`).join('')}<div class="small">Mock RAG – keyword retrieval over demo documents.</div>`;
}
function applyCommand(c) {
  if (!S.zones.length) return toast('Choose a starting point in step 3 first.', 'bad');
  if (c.type === 'cpad') {
    const cp = S.zones.find(z => z.seg === 'bar' && /charge/i.test(z.name)), tr = S.zones.find(z => z.seg === 'bar' && /trunnion/i.test(z.name)); if (!cp || !tr) return toast('Barrel charge pad / trunnion zones not found.', 'bad');
    cp.a0 = (360 - c.w / 2) % 360; cp.a1 = c.w / 2; tr.a0 = c.w / 2; tr.a1 = (360 - c.w / 2) % 360; markChanged(cp); markChanged(tr); S.gates.G3 = null;
    S.conceptReason = S.conceptReason || `Charge pad widened to ${c.w}° via assistant`; log('Assistant edit applied', `Charge pad ${c.w}°`, 'Requested in assistant');
  } else {
    const map = { barrel: z => z.seg === 'bar', trunnion: z => /trunnion/i.test(z.name), 'charge pad': z => /charge/i.test(z.name), 'top cone': z => z.seg === 'top', 'lower cone': z => z.seg === 'lc' };
    S.zones.filter(map[c.zone]).forEach(z => { z.t = c.t; markChanged(z); }); log('Assistant edit applied', `${c.zone} thickness ${c.t} mm`, 'Requested in assistant');
    if (!lengthsFor(c.zone.includes('top') ? 'top' : c.zone.includes('lower') ? 'lc' : 'bar').includes(c.t)) toast(`No TRL brick of ${c.t} mm – brickwork will flag this.`, 'bad');
  }
  CHAT.push({ who: 'bot', html: 'Applied. The concept and brickwork are re-opened; checks have been recalculated.' }); VIEW = 'step'; S.step = 3; render();
}
render();
