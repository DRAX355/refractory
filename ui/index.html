<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOF Lining Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--paper:#f5f7f5;--ink:#16201a;--muted:#5d6b62;--line:#d7dfd9;--edge:rgba(0,0,0,.25);--accent:#1f8a4c;--accent-soft:#e6f4ec;--warn:#b26a00;--warn-soft:#fff4e0;--bad:#b3261e;--bad-soft:#fdeceb;--info:#1f5fae;--info-soft:#e8f0fb;--side:#101713;--side-ink:#dfe8e2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111613;--paper:#18201b;--ink:#e6ece8;--muted:#9aa9a0;--line:#2c3831;--edge:rgba(255,255,255,.25);--accent:#4cc27f;--accent-soft:#16301f;--warn:#f0b050;--warn-soft:#33270f;--bad:#f08078;--bad-soft:#3a1916;--info:#7fb0f0;--info-soft:#152438;--side:#0b0f0d}}
:root[data-theme="dark"]{--bg:#111613;--paper:#18201b;--ink:#e6ece8;--muted:#9aa9a0;--line:#2c3831;--edge:rgba(255,255,255,.25);--accent:#4cc27f;--accent-soft:#16301f;--warn:#f0b050;--warn-soft:#33270f;--bad:#f08078;--bad-soft:#3a1916;--info:#7fb0f0;--info-soft:#152438;--side:#0b0f0d}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Inter Tight",system-ui,sans-serif}
header.top{position:fixed;top:0;left:0;right:0;height:52px;background:var(--side);color:var(--side-ink);display:flex;align-items:center;gap:14px;padding:0 14px;z-index:20}
.logo{font-weight:700;font-size:16px;white-space:nowrap}.logo i{color:#4cc27f;font-style:normal}
#projmeta{font-size:12.5px;opacity:.85;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select,header .tb{background:#1e2a23;color:var(--side-ink);border:1px solid #33443a;border-radius:6px;padding:5px 8px;font:inherit;font-size:12.5px}
header .tb{cursor:pointer}#who{font-size:12px;opacity:.8;white-space:nowrap}
aside.side{position:fixed;top:52px;bottom:0;left:0;width:228px;background:var(--side);color:var(--side-ink);overflow:auto;padding:10px 8px;z-index:10}
aside h5{margin:14px 8px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.st,.tool{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit}
.tool.fast{margin-top:6px;border:1px dashed #4cc27f;color:#4cc27f;font-weight:600}.btn.bulk{border-color:var(--accent);color:var(--accent)}
.st:hover,.tool:hover{background:#1c2721}.st.cur,.tool.cur{background:#1f8a4c;color:#fff}
.st .num{width:24px;height:24px;border-radius:50%;border:1.5px solid #4cc27f;display:grid;place-items:center;font-size:12px;flex:none}
.st.done .num{background:#4cc27f;color:#0b0f0d}.st small{display:block;font-size:10.5px;opacity:.7}.st.locked{opacity:.45}.st .lock{margin-left:auto;font-size:11px}
main#main{margin:52px 0 0 228px;padding:18px 22px 60px;min-height:calc(100vh - 52px);transition:margin .2s}
body.chat-open main#main{margin-right:360px}
.phead .kicker,.kicker{color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.phead h2{margin:2px 0 12px;font-size:22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px;min-width:0}
.card.inner{background:var(--bg);margin-top:12px}.card h3{margin:0 0 10px;font-size:15.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card h4{margin:6px 0 6px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g-40-60{grid-template-columns:2fr 3fr}.g-45-55{grid-template-columns:9fr 11fr}.grid2>*,.grid3>*{min-width:0}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.sticky{position:sticky;top:64px;align-self:start}
.guide{background:var(--info-soft);border-left:4px solid var(--info);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:14px;font-size:13.5px}.guide b{color:var(--info);margin-right:6px}
.btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover:not([disabled]){border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.sm{padding:4px 9px;font-size:12.5px}.btn.xs{padding:2px 7px;font-size:12px}.btn.big{padding:12px 22px;font-size:16px}.btn.full{width:100%;margin-top:8px}
.navbar{display:flex;justify-content:space-between;margin-top:8px}
.gatebox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--accent)}
.gate{display:inline-block;padding:3px 9px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:12.5px}.gate.done{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;white-space:nowrap}
.t-ref{background:var(--accent-soft);color:var(--accent)}.t-asm{background:var(--warn-soft);color:var(--warn)}.t-mock{background:var(--info-soft);color:var(--info)}.t-calc,.t-oth{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 8px}.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.na{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.bar{display:inline-block;width:70px;height:7px;border-radius:4px;background:var(--line);vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.bar.warnb i{background:var(--warn)}
.tw{overflow:auto}.tw.tall{max-height:440px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}.tbl th{position:sticky;top:0;background:var(--paper);font-size:12px;color:var(--muted)}
.tbl tr.grp td{background:var(--accent-soft);font-weight:700;color:var(--accent)}.tbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tbl tr.low{background:var(--warn-soft)}.tbl tr.conf td:first-child{box-shadow:inset 3px 0 var(--accent)}.tbl tr.flag{background:var(--bad-soft)}.tbl tr.ovr{background:var(--info-soft)}.tbl tr.sel{outline:2px solid var(--accent)}
.tbl tr[data-act]{cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input.num{width:84px}input.num.s{width:56px}input.reason{width:100%;margin-top:4px;border-color:var(--warn)}input.reason.wide{min-width:420px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}.fld input,.fld select{color:var(--ink);font-size:14px}.fld.inline{flex-direction:row;align-items:center;gap:8px;margin:4px 0}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:var(--muted)}.b{font-weight:700}.req{color:var(--bad)}.sug{color:var(--info)}.nowrap{white-space:nowrap}.center{display:flex;justify-content:center}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;margin-bottom:10px}
.note{padding:8px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-size:13px;margin:8px 0}.note.ok{background:var(--accent-soft);border-color:transparent}.note.bad{background:var(--bad-soft);border-color:transparent}
.checks{list-style:none;padding:0;margin:0}.checks li{margin:4px 0}
.chk{white-space:nowrap;cursor:pointer}
.svgv,.svgp,.svgu,.svgr{width:100%;height:auto;display:block}.svgb{width:48%;height:auto;display:inline-block}
.svt{font:11px "Inter Tight",sans-serif;fill:var(--ink)}.svt.sm{font-size:9.5px}.svt.b{font-weight:700}.svt.muted{fill:var(--muted)}.svt.lab{fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2px}
.zp{cursor:pointer}.zp:hover{filter:brightness(1.12)}.zp.zsel{filter:saturate(1.5) brightness(1.15) drop-shadow(0 0 1.5px var(--ink))}.zp.hl{filter:brightness(1.1) saturate(1.2)}
.views{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;align-items:start}.cap{font-size:11.5px;color:var(--muted);text-align:center;margin:2px 0 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.tabs .spacer{flex:1}.tab{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}.tabs.big .tab{font-size:13.5px;padding:7px 14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;border:1px solid var(--edge)}
.splitbar{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ze input:not(.num){width:140px}
ol.rank{margin:0;padding-left:20px}ol.rank li{margin:5px 0}
.pick{cursor:pointer}.pick.sel{outline:2px solid var(--accent);background:var(--accent-soft)}.pick h4{margin:0 0 4px}
.recwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}.opt.sel{border:2px solid var(--accent)}
.opt .oh{display:flex;gap:8px;align-items:baseline}.opt .rk{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 6px;font-weight:700;font-size:12px}.opt .score{margin-left:auto;font-weight:700;color:var(--accent);font-size:16px}
.opt .parts{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:4px 0}.why-list{margin:4px 0;padding-left:16px;font-size:12px;color:var(--muted)}.warnl{font-size:12px;color:var(--warn);margin:2px 0 6px}
.ringbox{text-align:center}
.why{background:none;border:1px solid var(--info);color:var(--info);border-radius:10px;font-size:10.5px;padding:0 6px;cursor:pointer;font-weight:600}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.kpis>div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:140px}.kpis b{display:block;font-size:19px}.kpis span{font-size:12px;color:var(--muted)}.kpis.col{flex-direction:column}
.sheetwrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.sheet{width:100%;min-width:760px;height:auto;display:block}
textarea.rat{width:100%;min-height:200px;font-size:13px}
.outcome{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:16px;margin-bottom:14px}.outcome h2{margin:0 0 6px;color:var(--accent)}.outcome .dl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.outcome .sheet{min-width:0}
.job{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer;background:var(--bg)}.job.sel{outline:2px solid var(--accent)}.job .mt{text-align:right;min-width:150px}.job .mt span{display:block}
.hit{border-left:3px solid var(--accent);padding:4px 10px;margin:8px 0;background:var(--bg);border-radius:0 6px 6px 0}.hit p{margin:4px 0}
.row{display:flex;gap:8px}.row input{flex:1}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
details summary{cursor:pointer;font-size:12.5px;color:var(--info);margin-top:6px}
.hero{max-width:980px}.hero h1{font-size:34px;margin:6px 0}.hero .lead{font-size:16px}
.flowline{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.fl{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}.fl b{color:var(--accent);margin-right:5px}.fl small{margin-left:5px;color:var(--warn);font-weight:700}
.legendline{margin:12px 0 18px;font-size:13px}
#chatwrap{position:fixed;top:52px;right:0;bottom:0;width:360px;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s;z-index:15}
body.chat-open #chatwrap{transform:none}
#chatwrap .ch{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
#chat{flex:1;overflow:auto;padding:10px}.msg{padding:8px 10px;border-radius:10px;margin:6px 0;font-size:13px}.msg.bot{background:var(--bg);border:1px solid var(--line)}.msg.me{background:var(--accent);color:#fff;margin-left:30px}
.msg .cite{color:var(--info);font-size:11.5px;font-weight:600}.msg .src{font-size:12px;color:var(--muted);margin-top:6px}
.sugs{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px}.sugs button{font-size:11.5px}
.cin{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.cin input{flex:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}#modal.on{display:flex}
.mbox{background:var(--bg);border-radius:12px;max-width:980px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}.mh{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.mb{padding:14px 16px}.badt{color:var(--bad)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px}.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px}.toast.ok{background:var(--accent);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@media (max-width:1100px){.grid-side,.recwrap,.views,.g-40-60,.g-45-55{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:800px){aside.side{position:static;width:auto;top:0}main#main{margin:52px 0 0 0;padding:14px 16px}.grid2,.grid3,.form2{grid-template-columns:1fr}#projmeta{display:none}body.chat-open main#main{margin-right:0}#chatwrap{width:100%}input.reason.wide{min-width:0;width:100%}}
@media print{header.top,aside.side,#chatwrap,.navbar,.guide,.gatebox,.tabs{display:none!important}main#main{margin:0}}
</style>
</head>
<body>
<style>
.t-drw{background:var(--accent-soft);color:var(--accent)}.t-trl{background:var(--info-soft);color:var(--info)}.t-cus{background:var(--warn-soft);color:var(--warn)}.t-edit{background:var(--bad-soft);color:var(--bad)}
.ftbl td{vertical-align:middle}.ftbl td:first-child{width:42%}.ftbl td small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.ftbl input,.ftbl select{width:150px}.ftbl input.wide{width:220px}.ftbl input[readonly]{background:var(--paper);color:var(--muted)}
.grp h3 .tag{font-size:11px}.ok-t{color:var(--accent);font-weight:700}.warn-t{color:var(--warn);font-weight:700}.err-t{color:var(--bad);font-weight:700}.na-t{color:var(--muted);font-weight:700}
.vlist{list-style:none;padding:0;margin:0}.vlist li{display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.zrow input{width:96px}.zrow input.nm{width:130px}.form2 input,.form2 select{width:100%}
.mini{width:64px!important}.pairtbl input{width:66px}.pairtbl input.mk{width:84px}
tr.mm td{background:var(--bad-soft)}tr.lowc td{background:var(--warn-soft)}
.sbar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line);font-size:11.5px;color:#fff;font-weight:600}.sbar div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.zonecard{border-left:5px solid var(--line)}
.alert{border-radius:10px;padding:9px 12px;margin:0 0 12px;font-size:13px}.alert ul{margin:6px 0 0;padding-left:18px}.alert.bad{background:var(--bad-soft);border:1px solid var(--bad);color:var(--ink)}.alert.bad b:first-child{color:var(--bad)}.alert.warn{background:var(--warn-soft);border:1px solid var(--warn)}.alert.warn summary{color:var(--warn);cursor:pointer}.alert.ok{background:var(--accent-soft);color:var(--accent);font-weight:600}.st .errb{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:700}.rules{border-style:dashed}.rules td.calc{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}.hint{margin-top:4px;padding:5px 8px;border-radius:6px;background:var(--info-soft);font-size:12.5px;color:var(--ink)}.hint b{color:var(--info)}.fixes{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.fixbtn{border-color:var(--accent);color:var(--accent);background:var(--bg)}.fixbtn:hover{background:var(--accent);color:#fff}
.grid-side.wide{grid-template-columns:minmax(0,1fr) 500px}.annp{max-height:calc(100vh - 76px);overflow:auto}.card[id]{scroll-margin-top:70px}.actcard{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.zprog{display:flex;gap:4px;margin:4px 0 8px}.zp-seg{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 2px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--muted)}.zp-seg.done{background:var(--accent);color:#fff;border-color:var(--accent)}.zp-seg.act{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);font-weight:700}
.svt.an{font-size:10px}.ann{paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
@media (max-width:1250px){.grid-side.wide{grid-template-columns:1fr}.annp{position:static;max-height:none}}
</style>
<header class="top">
  <div class="logo">Zero<i>Zeta</i> · Lining Copilot</div>
  <div id="projmeta"></div>
  <span id="who">Designer · Phase 1 (no knowledge base)</span>
  <button class="tb" data-act="fast" title="Demo only: confirm every step with the current values">✓✓ Demo: confirm all</button>
  <button class="tb" onclick="(function(){var r=document.documentElement;var d=r.getAttribute('data-theme');var dk=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dk?'light':'dark');})()" aria-label="Toggle theme">◐</button>

  <h5>Workflow</h5><div id="steps"></div>

  <button class="tool" data-act="audit">🕘 Audit log</button>
  <button class="tool" data-act="reset">↺ Reset demo</button>
  <p class="small" style="padding:10px 8px;color:#9aa9a0">Phase 1: no TRL knowledge base. Every TRL value is an input field. Sample values are pre-filled so the demo runs; they are not TRL-approved.</p>

<div id="modal"></div><div id="toasts"></div>
<script>
/* ============ CONSTANTS ============ */
const GRADE_LIST = ['TRL HMR C2R', 'TRL HMR C3R', 'TRL HMR C4', 'TRL HMR C5R', 'TRL MC-4', 'Steel-clad (SCB)'];
const GCOL = { 'TRL HMR C2R': '#6cae3e', 'TRL HMR C3R': '#2f5fd0', 'TRL HMR C4': '#b8892c', 'TRL HMR C5R': '#f08c86', 'TRL MC-4': '#35b6e8', 'Steel-clad (SCB)': '#8a8f98' };
function gcol(g) { if (GCOL[g]) return GCOL[g]; let h = 0; for (const c of String(g)) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h},55%,55%)`; }
const ZTYPES = ['Bottom', 'Lower cone', 'Barrel', 'Top cone', 'Mouth'];
const ZCOL = { 'Bottom': '#6cae3e', 'Lower cone': '#9bc46a', 'Barrel': '#2f5fd0', 'Top cone': '#b8892c', 'Mouth': '#8a8f98' };

/* Extraction result from the customer shell drawing (sample: 180 t BOF shell).
   key, group, label, unit, as written on drawing, extracted value, confidence, how found, directly comparable */
const EXT_DEF = [
  ['H', 'Overall', 'Overall vessel height (from bottom axis point 0)', 'mm', '10000', 10000, 0.97, 'Dimension text', 1],
  ['plate', 'Overall', 'Shell plate thickness', 'mm', '—', 70, 0.4, 'Not dimensioned; assumed, used to turn OD into ID', 0],
  ['dishR', 'Bottom dish', 'Bottom Dish Radius (working-lining hot face)', 'mm', 'R8350', 8350, 0.95, 'Arc radius annotation', 1],
  ['botDia', 'Bottom dish', 'Bottom Working Lining Diameter', 'mm', 'Ø5190.9', 5190.9, 0.96, 'Dimension text', 1],

    S.zones.push({ id: newId(), type: d.type, name: d.name || d.type, h0: start, h1: end }); renumber(d.type); if (end >= H - 0.01) { S.zones.push({ id: newId(), type: 'Mouth', name: 'Mouth', h0: H, h1: XN('H') }); toast('Mouth zone added automatically (calculated height)', 'ok'); } log('Zone added', `${d.name} ${f(start, 1)}–${f(end, 1)}`);
    const nxt = ZTYPES[Math.min(ZTYPES.indexOf(d.type) + 1, ZTYPES.length - 1)]; S.draft = { type: nxt, name: nxt, height: '' }; reopenFrom(2); render(); },
  fillTop: () => { const start = S.zones.length ? S.zones[S.zones.length - 1].h1 : 0; S.draft.height = +(mouthPlan().start - start).toFixed(1); render(); },
  selZone: el => { const i = +el.dataset.i; if (S.splitOpen && S.sel !== i) S.splitOpen = false; S.sel = S.sel === i && !S.splitOpen ? null : i; render(); },
  openSplit: el => { S.sel = +el.dataset.i; S.splitOpen = true; S.split = { mode: 'Equal segments', n: 2, els: '', hts: '' }; render(); },
  cancelSplit: () => { S.splitOpen = false; render(); },
  applySplit: () => { const z = S.zones[S.sel], sp = pendingSplits(); if (!z || !sp.length) return; const b = [z.h0, ...sp, z.h1];
    const segs = b.slice(0, -1).map((h, i) => ({ id: newId(), type: z.type, name: z.name === z.type || new RegExp('^' + z.type + ' \\d+$').test(z.name) ? z.type : `${z.name} ${i + 1}`, h0: h, h1: b[i + 1] }));
    if (S.segz && S.segz[z.id]) segs.forEach(q => { S.segz[q.id] = clone(S.segz[z.id]); INIT.segz[q.id] = clone(S.segz[z.id]); }); S.zones.splice(S.sel, 1, ...segs); renumber(z.type); S.splitOpen = false; log('Zone split', `${z.name} into ${segs.length} segments at ${sp.join(', ')}`); toast(`${z.name} split into ${segs.length} segments`, 'ok'); reopenFrom(2); render(); },
  mergeZone: el => { const i = +el.dataset.i, a = S.zones[i], b = S.zones[i + 1]; if (!b || a.type !== b.type) return; a.h1 = b.h1; if (S.segz) delete S.segz[b.id]; S.zones.splice(i + 1, 1); renumber(a.type); S.sel = i; log('Segments merged', `${a.name}`); reopenFrom(2); render(); },
  segTab: el => { S.segTab = S.segTab || {}; S.segTab[el.dataset.seg] = el.dataset.id; render(); },
  copySeg: el => { S.segz[el.dataset.to] = clone(S.segz[el.dataset.from]); log('Segment settings copied', `${el.dataset.from} → ${el.dataset.to}`); reopenFrom(Math.max(3, S.step)); toast('Settings copied', 'ok'); render(); },
  delZone: () => { S.sel = null; S.splitOpen = false; let z = S.zones.pop(); if (z.type === 'Mouth' && S.zones.length) z = S.zones.pop(); renumber(z.type); log('Zone removed', z.name); reopenFrom(2); render(); },
  addPair: el => { const arr = getP(S, el.dataset.p); arr.push(clone(arr[arr.length - 1] || pr('A', 'B', 900, 145, 160, 120, 185))); reopenFrom(S.step); render(); },
  delPair: el => { getP(S, el.dataset.p).splice(+el.dataset.i, 1); reopenFrom(S.step); render(); },
  fix: el => { const label = el.textContent.replace('⚡', '').trim(); let go = null;
    el.dataset.spec.split(';').forEach(pt => {
      if (pt.startsWith('act:')) { const a = pt.slice(4); if (ACT[a]) ACT[a](el); return; }
      if (pt.startsWith('go:')) { go = +pt.slice(3); return; }
      if (pt.startsWith('del:')) { const i = +pt.slice(4), z = S.zones[i], p = S.zones[i - 1]; if (z && p) { p.h1 = z.h1; if (S.segz) delete S.segz[z.id]; S.zones.splice(i, 1); renumber(z.type); } return; }
      const k = pt.indexOf('='), path = pt.slice(0, k), raw = pt.slice(k + 1); setP(S, path, raw === '' ? '' : (!isNaN(+raw) && !raw.includes(',') ? +raw : raw)); });
    log('Suggested fix applied', label); toast('Fix applied: ' + label, 'ok'); reopenFrom(Math.max(1, S.step)); if (go != null) { S.step = go; VIEW = 'step'; window.scrollTo(0, 0); } render(); },
  addMouth: () => { const zs = S.zones, last = zs[zs.length - 1]; if (last && last.type !== 'Mouth') zs.push({ id: newId(), type: 'Mouth', name: 'Mouth', h0: last.h1, h1: XN('H') }); render(); },
  addAsm: () => { S.asm.custom.push({ name: 'Lance port', mark: 'LP-1', grade: 'TRL HMR C3R', qty: 1, kg: 250 }); reopenFrom(ST.junc); render(); },
  delAsm: el => { S.asm.custom.splice(+el.dataset.i, 1); reopenFrom(ST.junc); render(); },
  addBand: () => { const b = S.bottom.bands; const l = b[b.length - 1]; b.push({ mark: 'SH-0' + (b.length + 1), from: (+l.to || 0) + 1, to: 99, aHot: '', aCold: '', bHot: '', bCold: '' }); reopenFrom(ST.bottom); render(); },
  delBand: el => { S.bottom.bands.splice(+el.dataset.i, 1); reopenFrom(ST.bottom); render(); },
  csv: () => { const rows = [['Zone', 'Mark', 'Grade', 'Qty', 'Tonnes']].concat(allBOQ().map(i => [i.zone, i.mark, i.grade, isFinite(i.qty) ? i.qty : '', i.tonnes.toFixed(3)])); download('BOM_' + S.job.ref.replace(/\W+/g, '_') + '.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv'); },
  json: () => download('Design_' + S.job.ref.replace(/\W+/g, '_') + '.json', JSON.stringify({ job: S.job, extraction: S.ext, zones: S.zones, segmentDesign: S.segz, permanentLining: { source: S.permSrc, reuse: S.permReuse, bottom: { grade: S.bottom.permGrade, t: S.bottom.permT } }, concept: conceptVessel(), junctions: S.junc, assemblies: S.asm, chargeSide: S.chargeSide, bottom: S.bottom, lowerCone: S.lc, barrel: S.barrel, topCone: S.cone, mouth: S.mouth, boq: allBOQ(), checks: allChecks(), log: S.log }, null, 1), 'application/json'),
  fast: () => { if (!S.job.drawing) ACT.sample(); if (!S.zones.length) ACT.suggestZones(); EXT_GROUPS.forEach(g => S.extOk[g] = true); for (let n = 0; n < LAST; n++) S.gates[n] = { t: nowT() }; S.step = LAST; VIEW = 'step'; log('Demo: all steps confirmed'); render(); },
};
function download(name, text, type) { const b = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Downloaded ' + name, 'ok'); }
if (typeof document !== 'undefined') {
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el); } });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'upl' && el.files[0]) { 
      const file = el.files[0];
      S.job.drawing = file.name; 
      log('Drawing uploaded', S.job.drawing); 
      toast('Processing drawing with backend...', 'ok'); 
      render(); 
      
      S.extracting = true;
      render();
      
      const formData = new FormData();
      formData.append('file', file);
      
        // We disable navigation during extraction to enforce waiting
        const navLinks = document.querySelectorAll('.sidebar a');
        navLinks.forEach(l => l.style.pointerEvents = 'none');
        
        fetch('http://localhost:8000/api/v1/extraction/process', { method: 'POST', body: formData })
        .then(res => {
          S.extracting = false;
          navLinks.forEach(l => l.style.pointerEvents = 'auto');
          if (!res.ok) return res.text().then(err => { throw new Error(err); });
          return res.json();
        })
        .then(data => {
          const geom = data.vessel_geometry;
          if (geom && geom.shell && geom.shell.profile) {
            const updateExt = (key, val, text) => {
              if (S.ext[key] && val !== undefined && val !== null) {
                S.ext[key].value = val;
                S.ext[key].drawing = text || String(val);
                S.ext[key].conf = 0.95;
              }
            };
            
            const mainSegs = geom.shell.profile.segments.slice()
                .sort((a, b) => a.index - b.index)
                .filter(s => s.height_mm > 20); // ignore tiny lips
            
            if (mainSegs.length >= 5) {
                let elev = 0;
                let s;
                
                // Determine horizontal scale factor if OCR read the exact barrel ID
                let vectorBarID = mainSegs[2].radius_bottom_mm * 2;
                let trueBarID = geom.shell.inner_diameter_mm ? geom.shell.inner_diameter_mm.value : vectorBarID;
                let scaleX = trueBarID / (vectorBarID || 1);
                
                // 0: Bottom Dish
                s = mainSegs[0];
                updateExt('dishShellH', s.height_mm, s.height_raw_text);
                updateExt('dishDepth', s.height_mm, s.height_raw_text); // approximate
                if (s.radius_bottom_mm < 1) { 
                    updateExt('dishR', 0); 
                    S.bottom.type = 'Conical';
                }
                elev += s.height_mm;
                
                // 1: Lower Cone
                s = mainSegs[1];
                updateExt('lcH0', elev);
                updateExt('lcIDb', s.radius_bottom_mm * 2 * scaleX);
                elev += s.height_mm;
                updateExt('lcH1', elev, `${s.height_raw_text} (height)`);
                updateExt('lcIDt', trueBarID); // Force connection to barrel
                
                // 2: Barrel
                s = mainSegs[2];
                updateExt('barH0', elev);
                updateExt('barID', trueBarID, geom.shell.inner_diameter_mm ? geom.shell.inner_diameter_mm.raw_text : undefined);
                elev += s.height_mm;
                updateExt('barH1', elev, `${s.height_raw_text} (height)`);
                
                // 3: Top Cone
                s = mainSegs[3];
                updateExt('topH0', elev);
                updateExt('topIDb', trueBarID); // Force connection to barrel
                elev += s.height_mm;
                updateExt('topH1', elev, `${s.height_raw_text} (height)`);
                updateExt('topIDt', s.radius_top_mm * 2 * scaleX);
                
                // 4: Mouth Ring
                s = mainSegs[4];
                updateExt('ringH0', elev);
                updateExt('ringID', s.radius_bottom_mm * 2 * scaleX);
                elev += s.height_mm;
                updateExt('ringH1', elev, `${s.height_raw_text} (height)`);
                updateExt('ringHt', s.height_mm, s.height_raw_text);
            } else {
              // Extraction found a profile, but maybe it had fewer than 5 segments?
              // Let's clear the mock values regardless if it's not a complete extraction
              Object.keys(S.ext).forEach(k => {
                 S.ext[k].value = '';
                 S.ext[k].drawing = '';
                 S.ext[k].conf = 0;
              });
              toast('Partial extraction. Vessel shape could not be fully identified.', 'bad');
            }

            // Priority: Explicit OCR text annotations overwrite geometric vector fallbacks
            if (geom.shell.total_length_mm) updateExt('H', geom.shell.total_length_mm.value, geom.shell.total_length_mm.raw_text);
            if (geom.shell.shell_thickness_mm) updateExt('plate', geom.shell.shell_thickness_mm.value, geom.shell.shell_thickness_mm.raw_text);
            
            // Note: if the extraction method is none, then we didn't find any segments
            if (geom.shell.profile.extraction_method === 'none' || mainSegs.length < 5) {
                toast('Extraction Warning: Vessel profile could not be extracted from this drawing style.', 'bad');
                // clear default segments
                S.bottom.type = 'Conical';
                updateExt('dishR', 0);
            } else {
                toast('Extraction complete. Dimensions updated.', 'ok');
            }

          }
          S.step = 1; // Auto-advance to the Extraction Review step
          render();
        })
        .catch(err => {
          S.extracting = false;
          navLinks.forEach(l => l.style.pointerEvents = 'auto');
          console.error(err);
          toast('Backend processing failed: ' + err.message, 'bad');
          render();
        });
      return; 
    }
    const p = el.dataset.p; if (!p) return;
    const old = getP(S, p); let v = el.value; if (el.type === 'checkbox') v = el.checked; else if (el.type === 'number') v = v === '' ? '' : +v; else if (typeof old === 'number' && v !== '' && !isNaN(+v)) v = +v;
    if (p.startsWith('zones.') && p.endsWith('.h1')) { const i = +p.split('.')[1]; const H = S.zones[S.zones.length - 1].type === 'Mouth' ? mouthPlan().start : XN('H'); v = Math.max(S.zones[i].h0 + 1, Math.min(+v, H)); S.zones[i].h1 = v; if (S.zones[i + 1]) S.zones[i + 1].h0 = v; for (let j = i + 1; j < S.zones.length; j++) { if (S.zones[j].h1 <= S.zones[j].h0) S.zones[j].h1 = Math.min(H, S.zones[j].h0 + 1); if (S.zones[j + 1]) S.zones[j + 1].h0 = S.zones[j].h1; } }
    else setP(S, p, v);
    if (p === 'draft.type') S.draft.name = v;
    if (!p.startsWith('draft.') && !p.startsWith('split.') && p !== 'annAll') { log('Value changed', `${p}: ${old} → ${v}`); reopenFrom(Math.max(1, S.step)); }
    render();
  });
  render();
}
